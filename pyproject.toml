[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "video2text"
version = "0.2.0"
description = "Turn Bilibili / Douyin videos into timestamped transcripts ready for AI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "EastonJiang" }]
dependencies = [
  "InquirerPy>=0.3.4",
  "rich>=13.9.4",
  "tqdm>=4.67.3",
  "typer>=0.12.5",
  "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
faster-whisper = [
  "faster-whisper>=1.1.0",
  # Newer tokenizers ship abi3 wheels for linux/arm64; without this uv may pick 0.13.x (sdist-only on py3.12).
  "tokenizers>=0.20",
]
whisper = [
  "openai-whisper>=20240930",
]
qwen3-asr = [
  "qwen-asr==0.0.6",
  "torch>=2.5.0",
  "numpy>=1.26.0",
]
sensevoice = [
  "funasr-onnx>=0.4.0",
  "jieba>=0.42.1",
  "torch>=2.5.0",
]
volcengine = [
  "requests>=2.32.3",
]
douyin = [
  "playwright>=1.49.0",
]
web = [
  "fastapi>=0.115.12",
  "uvicorn>=0.34.0",
]
server = [
  "fastapi>=0.115.12",
  "uvicorn>=0.34.0",
]
[project.scripts]
video2text = "v2t.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/v2t"]
